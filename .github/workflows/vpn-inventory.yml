name: vpn-inventory

# Pulls a read-only inventory of the VPN server over SSH, pseudonymises every
# host, address, key and password in it, and commits the result to server/.
#
# THIS REPOSITORY IS PUBLIC. Nothing may be committed or printed before it has
# been through .github/scripts/sanitize.py.

on:
  push:
    paths:
      - '.github/workflows/vpn-inventory.yml'
      - '.github/scripts/collect.sh'
      - '.github/scripts/sanitize.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpn-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPN_SSH_KEY: ${{ secrets.VPN_SSH_KEY }}
          VPN_KNOWN_HOSTS: ${{ secrets.VPN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          printf '%s\n' "$VPN_SSH_KEY" | tr -d '\r' > ~/.ssh/vpn_key

          # A secret stored as base64 is still a usable key - unwrap it.
          if ! grep -q -- '-----BEGIN' ~/.ssh/vpn_key; then
            if base64 -d < ~/.ssh/vpn_key > ~/.ssh/vpn_key.dec 2>/dev/null \
               && grep -q -- '-----BEGIN' ~/.ssh/vpn_key.dec; then
              mv ~/.ssh/vpn_key.dec ~/.ssh/vpn_key
              echo "note: key was base64-encoded, decoded it"
            else
              rm -f ~/.ssh/vpn_key.dec
            fi
          fi

          # A key pasted as one long line parses only after the body is reflowed.
          python3 - <<'PY'
          import os, re
          p = os.path.expanduser("~/.ssh/vpn_key")
          raw = open(p).read().strip()
          if raw.count("\n") < 3:
              m = re.match(r"-----BEGIN ([A-Z0-9 ]+)-----(.*?)-----END \1-----", raw, re.S)
              if m:
                  kind = m.group(1)
                  body = re.sub(r"\s+", "", m.group(2))
                  wrapped = "\n".join(body[i:i + 70] for i in range(0, len(body), 70))
                  open(p, "w").write(f"-----BEGIN {kind}-----\n{wrapped}\n-----END {kind}-----\n")
                  print("note: key was on a single line, reflowed it")
          PY

          # exactly one trailing newline
          printf '%s\n' "$(cat ~/.ssh/vpn_key)" > ~/.ssh/vpn_key.tmp
          mv ~/.ssh/vpn_key.tmp ~/.ssh/vpn_key
          chmod 600 ~/.ssh/vpn_key

          printf '%s\n' "$VPN_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/vpn_key; then
            echo "key format: openssh"
          elif grep -q 'BEGIN RSA PRIVATE KEY' ~/.ssh/vpn_key; then
            echo "key format: pem/rsa"
          elif grep -q 'BEGIN EC PRIVATE KEY' ~/.ssh/vpn_key; then
            echo "key format: pem/ec"
          elif grep -q 'BEGIN PRIVATE KEY' ~/.ssh/vpn_key; then
            echo "key format: pkcs8"
          elif grep -q 'ssh-\(rsa\|ed25519\)' ~/.ssh/vpn_key; then
            echo "key format: THIS IS A PUBLIC KEY, not a private one"
          else
            echo "key format: unrecognised"
          fi
          echo "key lines: $(wc -l < ~/.ssh/vpn_key)"
          echo "known_hosts entries: $(grep -c . ~/.ssh/known_hosts || true)"

          if ssh-keygen -y -P '' -f ~/.ssh/vpn_key >/dev/null 2>&1; then
            echo "key parses, no passphrase"
          else
            echo "warning: ssh-keygen cannot read the key unattended"
            echo "         (encrypted with a passphrase, or malformed)"
          fi

      - name: Collect inventory
        env:
          VPN_HOST: ${{ secrets.VPN_HOST }}
        run: |
          set -euo pipefail
          raw="$VPN_HOST"
          port=22
          case "$raw" in
            *:*) port="${raw##*:}"; raw="${raw%:*}" ;;
          esac
          case "$raw" in
            *@*) target="$raw" ;;
            *)   target="root@$raw" ;;
          esac
          SSHOPTS="-i $HOME/.ssh/vpn_key -p $port -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes"
          # shellcheck disable=SC2086
          if ! ssh $SSHOPTS "$target" 'echo connected' ; then
            echo "----- ssh failed, verbose retry -----"
            # shellcheck disable=SC2086
            ssh -v $SSHOPTS "$target" 'echo connected' || true
            exit 1
          fi
          # shellcheck disable=SC2086
          ssh $SSHOPTS "$target" 'bash -s' < .github/scripts/collect.sh
          # shellcheck disable=SC2086
          ssh $SSHOPTS "$target" 'cat /tmp/vpninfo.tgz' > /tmp/vpninfo.tgz
          # shellcheck disable=SC2086
          ssh $SSHOPTS "$target" 'rm -rf /tmp/vpninfo.tgz /tmp/vpninfo.d' || true
          echo "downloaded bytes: $(stat -c %s /tmp/vpninfo.tgz)"

      - name: Unpack and sanitise
        env:
          VPN_HOST_RAW: ${{ secrets.VPN_HOST }}
        run: |
          set -euo pipefail
          rm -rf server
          mkdir -p server
          tar xzf /tmp/vpninfo.tgz -C server
          rm -f /tmp/vpninfo.tgz
          python3 .github/scripts/sanitize.py server
          echo "total files: $(find server -type f | wc -l)"

      - name: Commit sanitised inventory
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A server
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(server): refresh sanitised VPN server inventory"
          git push origin "HEAD:${GITHUB_REF_NAME}"
